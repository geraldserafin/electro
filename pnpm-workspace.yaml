# TypeScript side of the monorepo (the Python packages under packages/ have no package.json)
packages:
  - apps/*
  - packages/*

# install scripts allowed to run: esbuild (tsx)
allowBuilds:
  esbuild: true
  "@parcel/watcher": false
  msgpackr-extract: false

patchedDependencies:
  '@yowasp/runtime@11.0.67': patches/@yowasp__runtime@11.0.67.patch

# one KaTeX: rehype-katex's typesets with the same one whose stylesheet the app loads (0.18 renamed its classes)
overrides:
  katex: ^0.18.9
