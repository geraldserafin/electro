# Monorepo root: a uv workspace of Python packages (apps/ will hold the web notebook).
[project]
name = "electro-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["electro", "electro-schematic", "electro-render"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
electro = { workspace = true }
electro-schematic = { workspace = true }
electro-render = { workspace = true }

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["packages/electro/tests", "packages/electro-schematic/tests", "packages/electro-render/tests", "apps/notebook/python"]
pythonpath = ["packages/electro/src", "packages/electro-schematic/src", "packages/electro-render/src", "apps/notebook/python"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".llvm-wasm", "*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "B905",  # zip() without strict=: the lengths match by construction
  "E731",  # lambdas as small named functions
  "E741", "E743",  # I, l: the names physics uses
  "F403", "F405",  # from electro import *: the library as a language
]
