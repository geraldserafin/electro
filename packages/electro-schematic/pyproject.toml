[project]
name = "electro-schematic"
version = "0.1.0"
description = "Schematy obwodów na siatce: model (JSON), rysunek → obwód, auto-layout, edycja"
requires-python = ">=3.10"
dependencies = ["electro"]

[tool.uv.sources]
electro = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
