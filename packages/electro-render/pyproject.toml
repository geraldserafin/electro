[project]
name = "electro-render"
version = "0.1.0"
description = "Wyświetlanie obwodów z pakietu electro: schematy SVG i ślad rozwiązania (Markdown + LaTeX)"
requires-python = ">=3.10"
dependencies = ["electro", "electro-schematic"]

[tool.uv.sources]
electro = { workspace = true }
electro-schematic = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../electro/src", "../electro-schematic/src"]
